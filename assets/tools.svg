<svg width="900" height="400" viewBox="0 0 900 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #FFF; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #A1A1AA; }
      .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFF; }
      .pill { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #FFF; }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="900" height="400" rx="20" fill="#090B10"/>

  <!-- Orbs -->
  <circle cx="450" cy="200" r="100" fill="#3B82F6" opacity="0.1" filter="url(#glow)" />

  <!-- Section Title -->
  <text x="50" y="60" class="title">Tools I build with</text>
  <text x="50" y="85" class="subtitle">My core stack and technologies</text>

  <!-- Core Backend Card -->
  <rect x="50" y="120" width="380" height="110" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="70" y="140" width="8" height="8" rx="4" fill="#00F5A0" />
  <text x="90" y="149" class="card-title">Backend & Runtime</text>
  
  <rect x="70" y="170" width="80" height="30" rx="6" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" />
  <text x="110" y="190" class="pill" text-anchor="middle">Node.js</text>
  
  <rect x="160" y="170" width="80" height="30" rx="6" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" />
  <text x="200" y="190" class="pill" text-anchor="middle">Express</text>
  
  <rect x="250" y="170" width="80" height="30" rx="6" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" />
  <text x="290" y="190" class="pill" text-anchor="middle">TS/JS</text>

  <!-- Frontend Card -->
  <rect x="470" y="120" width="380" height="110" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="490" y="140" width="8" height="8" rx="4" fill="#3B82F6" />
  <text x="510" y="149" class="card-title">Frontend Frameworks</text>

  <rect x="490" y="170" width="80" height="30" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="530" y="190" class="pill" text-anchor="middle">React.js</text>
  
  <rect x="580" y="170" width="80" height="30" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="620" y="190" class="pill" text-anchor="middle">Next.js</text>
  
  <rect x="670" y="170" width="80" height="30" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="710" y="190" class="pill" text-anchor="middle">Tailwind</text>

  <!-- GenAI Card -->
  <rect x="50" y="250" width="380" height="110" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="70" y="270" width="8" height="8" rx="4" fill="#7928CA" />
  <text x="90" y="279" class="card-title">Generative AI & LLMs</text>

  <rect x="70" y="300" width="100" height="30" rx="6" fill="rgba(121, 40, 202, 0.1)" stroke="rgba(121, 40, 202, 0.3)" />
  <text x="120" y="320" class="pill" text-anchor="middle">LangChain.js</text>
  
  <rect x="180" y="300" width="80" height="30" rx="6" fill="rgba(121, 40, 202, 0.1)" stroke="rgba(121, 40, 202, 0.3)" />
  <text x="220" y="320" class="pill" text-anchor="middle">Ollama</text>
  
  <rect x="270" y="300" width="80" height="30" rx="6" fill="rgba(121, 40, 202, 0.1)" stroke="rgba(121, 40, 202, 0.3)" />
  <text x="310" y="320" class="pill" text-anchor="middle">RAG</text>

  <!-- DevOps & DB Card -->
  <rect x="470" y="250" width="380" height="110" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="490" y="270" width="8" height="8" rx="4" fill="#F59E0B" />
  <text x="510" y="279" class="card-title">Databases & DevOps</text>

  <rect x="490" y="300" width="80" height="30" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="530" y="320" class="pill" text-anchor="middle">MongoDB</text>
  
  <rect x="580" y="300" width="80" height="30" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="620" y="320" class="pill" text-anchor="middle">Docker</text>
  
  <rect x="670" y="300" width="80" height="30" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="710" y="320" class="pill" text-anchor="middle">AWS</text>
</svg>
